name: App

# Builds the hosted tracker (app/) and, on main, pushes its image and asks Coolify to deploy.
# Secrets used: COOLIFY_WEBHOOK and COOLIFY_TOKEN (deploy). Without them the image is still pushed
# and the deploy step is skipped, so the workflow never fails just for missing deploy settings.
# The Supabase address and anon key are not needed at build time: the server reads them at run time.

on:
  push:
    branches: [main]
    paths: ["app/**", "src/**", "data/**", "tools/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", "src/**", "data/**", "tools/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ltu-study-tracker

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Tick merge tests
        run: node tools/test-ticks.mjs

      - name: Install
        working-directory: app
        run: npm ci

      - name: Type check
        working-directory: app
        run: npx tsc --noEmit

      - name: Build (page and app)
        working-directory: app
        run: npm run build

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3
        if: github.event_name != 'pull_request'

      - name: Build and push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Coolify
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "::notice::COOLIFY_WEBHOOK or COOLIFY_TOKEN not set; image pushed, deploy skipped."
            exit 0
          fi
          curl --silent --show-error --fail --request GET "$COOLIFY_WEBHOOK" --header "Authorization: Bearer $COOLIFY_TOKEN"
