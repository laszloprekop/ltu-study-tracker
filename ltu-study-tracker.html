/* hidden always wins: a class with its own display (the Bookings strip had display:flex) must not show an element meant to be hidden */

body{margin:0; background:var(--bg); color:var(--ink); font-family:"Public Sans","Helvetica Neue",Arial,sans-serif; font-size:15px; line-height:1.55}
.wrap{--gutter:clamp(16px, 2vw, 28px); max-width:none; margin:0; padding-inline:var(--gutter); padding-block:0 56px}

a{color:inherit}
button{font:inherit}
/* Phosphor duotone icons: both layers use currentColor, the back layer at 20 % */
/* Icons keep one size whatever the text around them: 16px, 14px for the small class. */
.ic{width:16px; height:16px; flex:0 0 auto; vertical-align:-.25em; fill:currentColor}
.ic.sm{width:16px; height:16px; vertical-align:-.25em}

/* ---------- Header ---------- */
/* the sticky header frosts what scrolls under it: the page colour, partly see-through, over a blur, across the full width */
header.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:color-mix(in oklch, var(--bg) 72%, transparent); -webkit-backdrop-filter:blur(14px) saturate(1.3); backdrop-filter:blur(14px) saturate(1.3); margin-inline:calc(-1 * var(--gutter)); padding-inline:var(--gutter); padding-block:10px 8px; margin-bottom:12px; display:flex; flex-direction:column; gap:8px}
#asof.stale{color:var(--c4); font-weight:600}
.moved{--rad:#ff6a00; font-family:Archivo,"Arial Narrow",sans-serif; font-stretch:72%; margin:0 0 14px; background:var(--rad); color:#000; border:2px solid #000; box-shadow:0 0 0 3px var(--rad), 0 6px 24px rgba(255,106,0,.35)}
.moved .mv-head{display:flex; align-items:center; gap:12px; padding:10px 14px}
.moved .mv-head .ic.big{width:40px; height:40px; flex:0 0 40px; color:#000}
.moved .mv-title{flex:1 1 auto; font-size:19px; font-weight:700; line-height:1.25; letter-spacing:.005em}
.moved a{color:#000; font-weight:700; text-decoration:underline; text-underline-offset:2px}
.moved button{font:inherit; font-size:14px; font-weight:700; padding:4px 12px; --bw:2px; --frame:#000; --fill:transparent; color:#000; cursor:pointer}
.moved button:hover{--fill:#000; color:var(--rad)}
.moved .mv-fold{flex:0 0 auto; padding:4px 8px}
.moved .mv-fold .ic{transition:transform .2s}
.moved .mv-body{padding:0 14px 14px 66px; font-size:15.5px; line-height:1.45; display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:6px 28px}
.moved .mv-body h4{margin:6px 0 4px; font-size:12px; letter-spacing:.06em; text-transform:uppercase}
.moved ol,.moved ul{margin:0; padding-left:20px}
.moved li{margin:2px 0}
.moved .mv-state{grid-column:1 / -1; margin:6px 0 0; padding:8px 10px; background:rgba(0,0,0,.08); border-left:4px solid #000}
.moved.drift .mv-state{background:#000; color:var(--rad)}
.moved.drift .mv-state a,.moved.drift .mv-state button{color:var(--rad); border-color:var(--rad)}
.moved .mv-state button{margin-left:8px}
.moved.folded{background:var(--surface-2); color:var(--muted); border:1px solid var(--line); box-shadow:none}
.moved.folded .mv-head{padding:5px 12px}
.moved.folded .mv-head .ic.big{width:16px; height:16px; flex-basis:16px; color:var(--muted)}
.moved.folded .mv-title{font-size:15px; font-weight:600}
.moved.folded a,.moved.folded button{color:var(--muted); border-color:var(--line)}
.moved.folded button:hover{background:var(--line); color:var(--ink)}
.moved.folded .mv-fold .ic{transform:rotate(-90deg)}
.moved.folded.drift .mv-title b{color:var(--alert)}
@media (max-width:700px){ .moved .mv-body{padding-left:14px} }
.appview .card{padding:16px 20px}
.appview h3{display:flex; align-items:center; gap:8px; margin:0 0 8px}
.appview ul,.appview ol{margin:4px 0 0; padding-left:20px; line-height:1.55}
.appview li{margin:4px 0}
.appview li b{color:var(--ink)}
.appview .grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:14px}
.appview .note{color:var(--muted); font-size:13px; margin:8px 0 0}
.tag.disagree{display:inline-flex; align-items:center; gap:3px; background:var(--c4-container); color:var(--on-c4-container)} 
.chains{padding:6px 10px}
.chain{border-left:4px solid var(--cc, var(--muted)); margin:6px 0; background:var(--surface)}
.chain summary{display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px; padding:6px 8px; cursor:pointer}
.chain .cdate{min-width:110px; font-size:12.5px} .chain .cprog{margin-left:auto; color:var(--muted); font-size:12.5px} .chain .late{color:var(--alert)}
.chain .prep{list-style:none; margin:0; padding:0 8px 8px 20px; display:flex; flex-direction:column; gap:3px}
.chain .prep li{display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px; font-size:13.5px}
.chain .prep li.done .tt{text-decoration:line-through; opacity:.6}
.chain .pdate{color:var(--muted); font-size:12px} .chain .pdate.doby{border:1px dashed var(--muted); padding:0 5px}
.tag.late{display:inline-flex; align-items:center; gap:3px; background:var(--alert-container); color:var(--on-alert-container)} 
.grid2{display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:14px}
.disagreements h3{display:flex; align-items:center; gap:8px} .disagreements .copyrep{margin-left:auto; font:inherit; font-size:12px; font-weight:700; padding:4px 10px; --frame:var(--muted); --fill:transparent; color:var(--ink); cursor:pointer}
.disagreements ul{margin:6px 0 0; padding-left:18px; font-size:13.5px} .disagreements li{margin:4px 0}
.cardsview .fld{flex:1 1 200px; font:inherit; font-size:13px; padding:6px 8px; color:var(--ink)}
.cardsview textarea{flex:1 1 100%}
/* Flip cards: a click turns the card over on its vertical axis. */
.fbar{display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 8px}
.cardsview .fbar button{display:inline-flex; align-items:center; gap:6px; font-weight:600; color:var(--ink); --fill:var(--surface-2); --frame:var(--line)}
.cardsview .fbar button[aria-pressed="true"]{color:var(--on-now-container); --fill:var(--now-container); --frame:var(--now)}
.fbar button .dot{width:8px; height:8px; background:var(--cc, var(--muted)); clip-path:polygon(0 0, 60% 0, 100% 40%, 100% 100%, 0 100%)}
.fbar button small{font-weight:400; opacity:.8}
.fgrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:18px; margin-top:10px}
@media (max-width:520px){ .fgrid{grid-template-columns:1fr} }
.fcard{perspective:1400px; display:flex; cursor:pointer; outline:none; max-width:380px; width:100%; min-width:0; container-type:inline-size}
.fcard:focus-visible .fc-body{box-shadow:inset 0 0 0 2px var(--now)}
/* at least a playing card's 5 to 7, measured on the card's own width; taller when the text needs it */
.fc-in{flex:1 1 auto; min-width:0; display:grid; min-height:140cqw; transition:transform .55s cubic-bezier(.2,.7,.2,1); transform-style:preserve-3d}
.fcard.flipped .fc-in{transform:rotateY(180deg)}
/* the face carries the shadow, its body the cut corner, so the shadow follows the bevelled shape */
/* --card-lift comes with the palette (tools/palette.mjs) */
.fc-face{grid-area:1 / 1; display:flex; backface-visibility:hidden; -webkit-backface-visibility:hidden; filter:var(--card-lift)}
.fc-back{transform:rotateY(180deg)}
.fc-body{flex:1 1 auto; min-width:0; overflow-wrap:anywhere; display:flex; flex-direction:column; gap:7px; padding:12px 14px 14px;
  --bev:16px; --bw-t:5px; --stripe:var(--cc, var(--now)); --frame:linear-gradient(var(--stripe) 5px, var(--line) 5px); --fill:var(--surface)}
/* the course stripe is the frame's top side, 5 px, following the cut */
.fc-back .fc-body{--stripe:var(--now); --fill:var(--surface-2)}
.fc-meta{display:flex; flex-wrap:wrap; align-items:center; gap:6px; font-size:12px; color:var(--muted)}
.fc-meta{flex-wrap:nowrap} .fc-meta .fc-ev{flex:1 1 auto; min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis}
.fcard.hiddencard .fc-body{opacity:.55}
/* votes and hide: one row under the ratings; the pressed vote is the viewer's own */
.fc-act{display:flex; gap:4px; margin-top:2px}
.cardsview .fc-act button{flex:1 1 0; min-width:0; display:inline-flex; align-items:center; justify-content:center; gap:4px; padding:4px 2px; font-size:11.5px; font-weight:600; color:var(--muted); --fill:transparent; --frame:var(--line)}
.cardsview .fc-act button[aria-pressed="true"]{color:var(--on-now-container); --fill:var(--now-container); --frame:var(--now-container)}
.cardsview .fc-act button[data-cardvote="fix"][aria-pressed="true"]{color:var(--on-alert-container); --fill:var(--alert-container); --frame:var(--alert-container)}
.cardsview .fc-act button:disabled{opacity:.5; cursor:default}
.cardsview .fc-act button b{font-weight:700}
.tag.trust.ok{color:var(--on-c2-container); background:var(--c2-container)}
.tag.trust.bad{color:var(--on-alert-container); background:var(--alert-container)}
.fbar.trust{align-items:center; margin-top:-2px}
.fbar.trust .small{margin-right:2px}
/* a rated card zooms out, shrinking into the distance, and is gone */
@keyframes pluck{to{transform:scale(.05); opacity:0}}
.fcard.pluck{animation:pluck .36s cubic-bezier(.5,0,.75,0) forwards; pointer-events:none; z-index:5; position:relative}
@media (prefers-reduced-motion:reduce){ .fcard.pluck{animation:none} }

/* Labels: chip (course), lvl (MUST/NICE) and tag share one size, so they sit level in a row. */
.tag,.lvl,.chip{display:inline-flex; align-items:baseline; gap:3px; font-size:10.5px; line-height:1.5; letter-spacing:.05em; text-transform:uppercase; padding:1px 6px; vertical-align:1px; white-space:nowrap}

/* icons inside labels: small, in the label's own colour */
.tag .ic,.lvl .ic,.flag .ic,.est .ic,.kind .ic,.fc-foot .ic,.fc-ev .ic,.cardsn .ic,.nref .ic{width:12px; height:12px}

/* an inline-flex label takes its baseline from its first item; with align-items:baseline that is its
   text, not the leading icon (an svg's baseline is its bottom edge), and the icon is centred on its own */
.tag > .ic,.lvl > .ic,.chip > .ic,.flag > .ic,.kind span > .ic,.est > .ic,.cardsn > .ic,.fc-ev > .ic,.fc-due > .ic{align-self:center}

.ann .mute.more{margin-left:auto; color:inherit}
/* the row menu (Share, Hide) and the short note a Link or a share leaves */
.rowmenu{position:absolute; z-index:40; display:flex; flex-direction:column; min-width:180px; padding:4px; background:var(--surface); color:var(--ink); border:1px solid var(--line); box-shadow:var(--shadow), 0 6px 20px rgba(0,0,0,.18)}
.rowmenu[hidden]{display:none}
.rowmenu button{display:flex; align-items:center; gap:8px; padding:8px 10px; border:0; background:none; color:inherit; font:inherit; font-size:13px; text-align:left; cursor:pointer}
.rowmenu button:hover,.rowmenu button:focus-visible{background:var(--surface-2); outline:none}
.toast{position:fixed; z-index:50; left:50%; bottom:max(16px, env(safe-area-inset-bottom)); transform:translateX(-50%); display:flex; align-items:center; gap:10px; max-width:calc(100vw - 32px); padding:10px 14px; background:var(--ink); color:var(--surface); font-size:13px; overflow-wrap:anywhere; box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast[hidden]{display:none}
.toast button{border:0; padding:4px 8px; background:var(--surface); color:var(--ink); font:inherit; font-weight:600; cursor:pointer}
/* the row a Link points at, lit for a moment */
.flash{animation:flash 2.4s ease-out}
@keyframes flash{0%,30%{box-shadow:0 0 0 3px var(--now); background-color:var(--now-container)} 100%{box-shadow:0 0 0 3px transparent}}
@media (prefers-reduced-motion:reduce){ .flash{animation:none; outline:3px solid var(--now)} }
.cardsview .fc-act button.share{flex:0 0 auto; padding:4px 8px}
.cardsview h3 .setshare{margin-left:8px; display:inline-flex; align-items:center; gap:4px; font-size:12px; padding:3px 8px}
.fgrid.one{max-width:420px}

.chip{font-weight:600; margin-right:7px; color:var(--on-cc-container); background:var(--cc-container)}
.ph{display:inline-block; flex:0 0 auto; line-height:0; border-radius:50%; overflow:hidden; isolation:isolate; background:#fff; background:color-mix(in oklch, var(--cc) 32%, #fff)}
.ph img{display:block; width:100%; height:100%; object-fit:cover; mix-blend-mode:multiply}
.faces{display:inline-flex; vertical-align:-4px; margin-right:5px}
.faces .ph{width:18px; height:18px; border:1.5px solid var(--surface); margin-left:-6px}
.faces .ph:first-child{margin-left:0}

.links{display:flex; flex-wrap:wrap; gap:6px; margin-top:5px}
.links a{display:inline-flex; align-items:center; gap:4px; font-size:11.5px; line-height:1.4; text-decoration:none; color:var(--ink); background:var(--bg); padding:2px 7px}
.links a .ic{color:var(--muted)}
.links a.io{padding:3px 6px; gap:1px}
.links a.io:hover .ic{color:var(--ink)}
.links a.io .ic.ext{width:16px; height:16px; margin-left:0}
.ic.ext{width:16px; height:16px; color:var(--muted); margin-left:2px; vertical-align:-.25em}
.links a:hover{border-color:var(--ink)}
.links a:focus-visible,.quick a:focus-visible{outline:2px solid var(--ok); outline-offset:-2px}
.quick{display:flex; flex-wrap:wrap; gap:8px}
.quick a{font-size:13px; text-decoration:none; color:var(--ink); background:var(--bg); padding:6px 10px}
.quick a:hover{border-color:var(--ink)}
.quick a .k{display:flex; align-items:center; font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--cc); margin-bottom:2px}
.quick .faces{vertical-align:0}
.quick .faces .ph{width:16px; height:16px}

/* ---------- Week cards ---------- */
.weeks{--rail:132px; display:flex; flex-direction:column; gap:14px}
.week{display:grid; grid-template-columns:var(--rail) minmax(0,1fr); gap:0; scroll-margin-top:130px}
/* the current week: a 2px ring in the accent colour, drawn behind the surface with the same cut corner */
.week.now{--bw:2px; --frame:var(--now)}
.week .rail{padding:14px 12px 14px 16px; background:var(--surface-2)}
.week .rail .wk{font-size:17px; font-family:Archivo,sans-serif; font-weight:700; letter-spacing:-.01em; display:flex; align-items:center; gap:4px}
.week .rail .dates{font-size:11.5px; color:var(--muted); margin-top:2px}
.week .rail .load{display:flex; align-items:center; gap:4px; font-family:Archivo,"Arial Narrow",sans-serif; font-stretch:78%; font-size:12.5px; letter-spacing:.01em; color:var(--muted); margin-top:6px; cursor:help; white-space:nowrap}
.week .rail .load .hv{font-weight:700; font-size:13.5px; color:var(--ink)}
.week .rail .load + .load{margin-top:2px}
.week .rail .left{display:none; font-size:11.5px; font-weight:600; color:var(--alert); margin-top:4px}
.week.collapsed .rail .left{display:inline}
.week .rail .left.clear{color:var(--ok)}
.fold{display:inline-flex; border:0; background:none; color:var(--muted); cursor:pointer; padding:0; transition:transform .15s}
.week.collapsed .fold{transform:rotate(-90deg)}
.week.collapsed .rows,.week.collapsed .quiet{display:none}
.week.collapsed{grid-template-columns:1fr}
.week.collapsed .rail{display:flex; flex-wrap:wrap; gap:4px 14px; align-items:center; padding:10px 16px; border-right:0}
.week.collapsed .rail .dates,.week.collapsed .rail .load,.week.collapsed .rail .left,.week.collapsed .flag{margin-top:0}
.flag{display:inline-block; margin-top:8px; font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--on-alert-container); background:var(--alert-container); padding:2px 6px; font-weight:600}
.flag.nowflag{color:var(--on-now-container); background:var(--now-container)}
.week .quiet{padding:14px 16px; color:var(--muted); font-size:13.5px}
/* The Today playhead reaches left across the rail and peeks out of the card */
.playhead{position:relative; z-index:2; display:flex; align-items:center; margin:12px 0 6px calc(-16px - var(--rail) - 14px)}
.playhead .phl{flex:0 0 auto; font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--on-now-container); background:var(--now-container); padding:3px 10px; box-shadow:0 0 0 3px var(--bg)}
.playhead::after{content:""; flex:1 1 auto; height:2px; background:var(--now)}

/* Announcements and material blocks inside a week */
.ann{display:flex; gap:8px; align-items:flex-start; margin:8px 0 2px; padding:8px 12px; background:var(--ann-container); color:var(--on-ann-container); font-size:13px}
.ann > .ic{color:var(--on-ann-container); margin-top:2px}
.ann .k{font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; font-weight:600; color:var(--on-ann-container); margin-right:8px}
.ann a{color:inherit}
.ann .why{color:var(--on-ann-container)}
.mat{margin-top:12px; padding-top:8px}
.mat summary{cursor:pointer; font-size:13px; font-weight:600; list-style:none; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.mat summary::-webkit-details-marker{display:none}
.mat summary > .caret{color:var(--muted); transition:transform .15s; transform:rotate(-90deg)}
.mat[open] summary > .caret{transform:none}
.mat summary .sum{font-weight:400; color:var(--muted); font-size:12.5px}
.mat .why{color:var(--muted); font-size:12.5px; margin:4px 0 2px 22px; display:block}
.mat ul{list-style:none; margin:4px 0 0 0; padding:0}
.mat li{display:flex; gap:9px; align-items:flex-start; padding:5px 0 5px 16px; font-size:13.5px}
.mat li.lvl-must{border-left:3px solid var(--alert); margin-left:-16px; padding-left:29px}
.day .mat li.lvl-must{padding-left:13px}
.panel .mat li.lvl-must{margin-left:-18px; padding-left:15px}
.mat li .box{width:14px; height:14px; margin-top:3px}
.mat li .box input{width:14px; height:14px; accent-color:var(--now)}
.mat li label{cursor:pointer; flex:1 1 auto; min-width:0}
.mat li.done .tt{text-decoration:line-through; color:var(--muted)}
.mat li .num{color:var(--muted); font-size:12px; margin-right:6px}
.mat li .kind{color:var(--muted); font-size:12px; margin-left:6px}
/* the Prepare line under an assessment: what it tests, each a link to its Cards or to Canvas */
.prepare{display:flex; flex-wrap:wrap; align-items:center; gap:3px 5px; margin-top:3px; font-size:12px; color:var(--muted)}
.prepare .nlab{font-weight:600; margin-right:1px}
.prepare .nref{display:inline-flex; align-items:center; gap:3px; font:500 11.5px "IBM Plex Mono",ui-monospace,monospace; color:var(--cc, var(--ink)); background:var(--surface-2); border:1px solid var(--line); padding:0 5px; line-height:18px; cursor:pointer; text-decoration:none}
.prepare .nref:hover{border-color:var(--cc, var(--muted))}
.prepare .nref.cards{background:var(--cc-container); color:var(--on-cc-container); border-color:transparent}
.prepare .nref sup{font-size:9px; line-height:0; margin-left:1px}
.prepare .nref.ok{color:var(--muted); text-decoration:line-through; opacity:.7}
.prepare .nsum{margin-left:3px}
.prepare.ready{opacity:.6}
.mat li.done .prepare,.row.done .prepare{opacity:.6}
.mat li a.go{display:inline-flex; color:var(--muted); padding:2px}
.mat li a.go:hover{color:var(--ink)}
.creq{flex:0 0 auto; display:inline-flex; margin-top:2px; color:var(--muted); cursor:help}
.creq.done{color:var(--ok)}
.creq.none{visibility:hidden}

/* ---------- Day view ---------- */
.dayctl{display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; margin-bottom:12px}
.dayctl input[type=date]{font:inherit; font-size:13.5px; padding:4px 8px; border:0; background:var(--surface); color:var(--ink)}
.dayctl button{font-size:12.5px; font-weight:600; background:var(--surface); border:0; padding:4px 10px; cursor:pointer; color:var(--ink)}
.day{display:grid; grid-template-columns:repeat(auto-fill, minmax(340px, 1fr)); gap:14px; grid-auto-flow:dense; align-items:start}
.day .card{padding-bottom:4px}
.day h3{font-size:13.5px; padding:12px 16px 4px; display:flex; gap:8px; align-items:center}
.day h3 .ic{color:var(--muted)}
.day h3 .sum{font-weight:400; color:var(--muted); font-size:12.5px}
.day .none{padding:6px 16px 12px; color:var(--muted); font-size:13px}
.day .mat{border-top:0; padding:0 16px 8px; margin-top:0}
.day .mat li{padding-left:0}
.freeday{padding:4px 16px 12px; font-size:13.5px}
.freeday .w{display:flex; justify-content:space-between; gap:12px; padding:5px 8px; margin:0 -8px}
.freeday .w:nth-child(even){background:var(--surface-2)}
.freeday .w:first-child{border-top:0}
.freeday .w.best{color:var(--ok); font-weight:600}
.freeday .w small{color:var(--muted); font-weight:400}

/* ---------- Map view ---------- */
html,body{height:100%}
body.mapview{overflow:hidden}
body.mapview .wrap{height:100%; display:flex; flex-direction:column; padding-bottom:10px}
body.mapview header.top{position:static; flex:0 0 auto}
body.mapview #termbody{flex:1 1 auto; min-height:0; display:flex; flex-direction:column}
body.mapview #termbody section{flex:1 1 auto; min-height:0; margin-bottom:12px; display:flex}
.map{position:relative; display:grid; grid-template-columns:clamp(230px, 18vw, 300px) minmax(0,1fr) clamp(340px, 26vw, 460px); gap:14px; flex:1 1 auto; min-height:0; width:100%}
/* Collapsed rail: the map takes its column and the rail sits over the map's left edge as a thin timeline of dots */
.map.rail-slim{grid-template-columns:minmax(0,1fr) clamp(340px, 26vw, 460px)}
.map.rail-slim .legend-g{left:calc(var(--rail-w, 36px) + 10px)}
.map.rail-slim .mapcard h3{padding-left:calc(var(--rail-w, 36px) + 12px)}
.map h3 .t{white-space:nowrap}
.rail-toggle{margin-left:auto; display:inline-flex; align-items:center; color:var(--muted); background:none; border:0; padding:0 2px; cursor:pointer; line-height:1}
.rail-toggle:hover{color:var(--ink)}
.rail-toggle .ic{width:16px; height:16px; transition:transform .15s}
.rail-card.slim{position:absolute; left:0; top:0; bottom:0; width:var(--rail-w, 36px); z-index:3; align-items:center; padding:6px 0 6px; --fill:color-mix(in oklch, var(--surface) 86%, transparent); backdrop-filter:blur(4px)}
.rail-card.slim::after{clip-path:none}
.rail-card.slim .rail-toggle{margin:0; padding:4px 0}
/* The folded rail as a timeline: rows of squares, one square per unit of time an event covers; overlaps sit in the next lane */
.rail-strip{flex:1 1 auto; min-height:0; width:100%; position:relative; margin:4px 0; overflow:hidden; --sq:8px; --cbev:max(3px, calc(var(--sq) * .3))}
.rail-inner{position:absolute; left:0; right:0; top:0; transition:transform .35s ease; will-change:transform}
.rail-strip .ev{position:absolute; background:none; border:0; padding:0; margin:0; cursor:pointer; display:block; transition:top .35s ease, left .35s ease, width .35s ease, height .35s ease, opacity .3s ease}
.rail-strip .ev i{position:absolute; left:0; width:var(--sq); height:var(--sq); background:var(--cc); transition:top .35s ease, width .35s ease, height .35s ease}
/* the first cell of an event is its start at every level, and carries the page's cut corner */
.rail-strip .ev i:first-child{--bev:var(--cbev); clip-path:var(--cut)}
.rail-strip .gapc{overflow:hidden}
.rail-strip .gapc.hid{opacity:0; pointer-events:none}
.rail-strip .gapc,.rail-strip .nowline{transition:opacity .3s ease, top .35s ease, height .35s ease}
.rail-strip.pan{cursor:grab}
.rail-strip.dragging,.rail-strip.dragging .ev{cursor:grabbing}
.rail-strip .in,.rail-strip .out{opacity:0}
.rail-card.slim{transition:width .35s ease}
.map.rail-slim .legend-g{transition:left .35s ease}
.map.rail-slim .mapcard h3{transition:padding-left .35s ease}
.rail-strip .ev.done i::before{content:""; position:absolute; inset:1px; background:var(--surface)}
.rail-strip .ev.done i:first-child::before{clip-path:polygon(0 0, calc(100% - var(--cbev) + 1px) 0, 100% calc(var(--cbev) - 1px), 100% 100%, 0 100%)}
.rail-strip .ev.muted{opacity:.35}
.rail-strip .ev.past{opacity:.45}
.rail-strip .ev.in,.rail-strip .ev.out{opacity:0}
/* Rings are drawn per cell, as a layer behind it that is a little larger and cut the same way, so they follow the corner */
.rail-strip .ev i::after{content:""; position:absolute; left:calc(-1 * var(--ring, 0px)); right:calc(-1 * var(--ring, 0px)); top:0; bottom:-1px; z-index:-1; background:var(--ring-c, transparent); opacity:0; transition:opacity .15s}
.rail-strip .ev i:first-child::after{top:calc(-1 * var(--ring, 0px)); clip-path:polygon(0 0, calc(100% - var(--cbev) - var(--ring, 0px)) 0, 100% calc(var(--cbev) + var(--ring, 0px)), 100% 100%, 0 100%)}
.rail-strip .ev i:last-child::after{bottom:calc(-1 * var(--ring, 0px))}
.rail-strip .ev i.z::before,.rail-strip .ev i.z::after{display:none}
.rail-strip .ev:hover,.rail-strip .ev:focus-visible{z-index:2; --ring:1px; --ring-c:var(--ink)}
.rail-strip .ev.rel,.rail-strip .ev[data-rel]{z-index:2; --ring:1px; --ring-c:var(--now)}
.rail-strip .ev[aria-current="true"]{z-index:3; --ring:var(--ringsel, 2px); --ring-c:var(--now)}
.rail-strip .ev:hover i::after,.rail-strip .ev:focus-visible i::after,.rail-strip .ev.rel i::after,.rail-strip .ev[data-rel] i::after,.rail-strip .ev[aria-current="true"] i::after{opacity:1}
.rail-strip .gapc{position:absolute; left:4px; right:2px; display:flex; align-items:center; gap:3px; pointer-events:auto; cursor:help}
.rail-strip .gapc svg{flex:0 0 auto}
.rail-strip .gapc path{fill:none; stroke:var(--muted); stroke-width:1.3; stroke-linecap:round}
.rail-strip .gapc span{font-size:9px; font-weight:600; color:var(--muted); letter-spacing:.02em; white-space:nowrap}
.rail-strip .nowline{position:absolute; left:2px; right:2px; height:2px; background:var(--now); box-shadow:0 0 6px var(--now); pointer-events:none; z-index:4}
.rz{display:flex; gap:2px; flex-wrap:wrap; justify-content:center; width:100%; padding:0 3px}
.rz button{display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px; background:var(--surface-2); border:0; padding:0; color:var(--muted); cursor:pointer}
.rz button:hover{color:var(--ink)}
.rz button:disabled{opacity:.3; cursor:default}
.rz button .ic{width:16px; height:16px}
.rz-lbl{font-size:10px; font-weight:600; color:var(--muted); text-align:center; margin-top:4px; letter-spacing:.04em; white-space:nowrap}
.rail-tip{position:absolute; z-index:6; left:44px; transform:translateY(-50%); background:var(--ink); color:var(--bg); font-size:12px; line-height:1.3; padding:4px 9px; pointer-events:none; max-width:min(360px, 60vw); box-shadow:var(--shadow)}
.rail-tip.below{transform:none}
.rail-tip b{display:block; font-size:11px; font-weight:600; opacity:.75}
.map > .card{min-height:0; display:flex; flex-direction:column}
.map h3{font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); padding:12px 14px 6px; display:flex; align-items:center; gap:6px}
.map h3 .ic{color:var(--muted)}
.rail-list{overflow:auto; padding:4px 10px 14px 14px; position:relative}
.rail-list::before{content:""; position:absolute; left:19px; top:8px; bottom:14px; width:2px; background:var(--line)}
.rail-list .rd{position:relative; padding:8px 0 2px 18px; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; font-weight:600; color:var(--muted)}
.rail-list .rd::before{content:""; position:absolute; left:2px; top:14px; width:12px; height:2px; background:var(--muted)}
.rail-list .rd.today{color:var(--now)}
.rail-list .rd.today::before{background:var(--now); height:3px}
.rail-list .ev{display:block; width:100%; text-align:left; background:none; border:0; padding:4px 6px 4px 18px; font-size:13px; line-height:1.3; color:var(--ink); cursor:pointer}
.rail-list .ev:hover{background:var(--surface-2)}
.rail-list .ev[aria-current="true"]{background:var(--now-soft)}
.rail-list .ev[aria-current="true"] small{color:var(--ink)}
.rail-list .ev.rel,.rail-list .ev[data-rel]{box-shadow:inset 3px 0 0 var(--now)}
.rail-list .ev .tt{display:inline}
.rail-list .ev small{display:block; color:var(--muted); font-size:11px}
.rail-list .ev.done .tt{text-decoration:line-through; color:var(--muted)}
.rail-list .ev.muted{opacity:.45}
.gwrap{position:relative; flex:1 1 auto; min-height:0; overflow:hidden}
.gwrap svg{width:100%; height:100%; display:block; touch-action:none}
.gwrap svg.drag{cursor:grabbing}
.gtools{position:absolute; top:10px; right:10px; display:flex; gap:4px}
.gtools button{display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:600; color:var(--muted); background:var(--bg); border:0; padding:4px 7px; cursor:pointer; line-height:1.2}
.gtools button .ic{width:16px; height:16px}
.gtools button:hover{color:var(--ink)}
.gtools button:disabled{opacity:.4; cursor:default}
.gtools button:disabled:hover{color:var(--muted)}
.gtools button[aria-pressed="true"]{color:var(--on-now-container); background:var(--now-container); border-color:var(--now-container)}
.gtools .seg.mode{ background:var(--bg)}
.gtools .seg.mode button{ border:0; padding:4px 8px}
.gtools .seg.mode button:first-child{border-left:0}
.gtools button[aria-pressed="true"] .ic{fill:var(--on-now-container)}
.gtools .reach{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:var(--muted); background:var(--bg); padding:3px 8px}
.gtools .reach input{width:70px; accent-color:var(--now); margin:0}
.gtools .reach b{color:var(--ink); min-width:42px}
svg.showall .gn.section:not(.hl):not(.sel):not(.hover):not(.cur){opacity:.35}
svg.showall .gn.item:not(.hl):not(.sel):not(.hover):not(.cur){opacity:.22}
svg.showall .gn.item:not(.hl):not(.sel):not(.hover):not(.cur) .lab,svg.showall .gn.section:not(.hl):not(.sel):not(.hover) .lab{display:none}
svg.showall .ge.lvsection:not(.hl),svg.showall .ge.lvitem:not(.hl){opacity:.08}
.gn{cursor:pointer; transition:opacity .4s ease}
.ge{transition:opacity .45s ease, stroke-width .3s ease}
.gn circle.body,.gn path.pill{transition:stroke .3s ease, fill .3s ease, stroke-width .3s ease}
.gn .sub,.gn .lab{transition:opacity .3s ease}
@media (prefers-reduced-motion:reduce){ .gn,.ge,.gn circle.body,.gn path.pill,.gn .sub,.gn .lab,.rail-strip .ev,.rail-strip .ev i,.rail-strip .gapc,.rail-strip .nowline,.rail-card.slim,.rail-inner{transition:none} }
svg.focus .gn:not(.hl){opacity:.22}
svg.focus .ge:not(.hl):not(.tl){opacity:.04}
/* a lit chain is fully opaque; only the widths keep the trunk-to-twig order */
svg.focus .ge.hl{opacity:1}
svg.focus .ge.lvmodule.hl{stroke-width:4}
svg.focus .ge.lvsection.hl{stroke-width:2.6}
svg.focus .ge.lvitem.hl,svg.focus .ge.dep.hl{stroke-width:1.8}
svg.focus .ge.tl.hl{stroke:var(--now)}
.gwrap svg{cursor:grab}
.gn path.pill{fill:var(--cc-container); stroke:var(--cc); stroke-width:1}
.gn circle.body{fill:var(--cc-container); stroke:var(--cc); stroke-width:1.2}
.gn.section circle.body{opacity:.8}
.gn .gl{font-family:Archivo,sans-serif; font-weight:700; font-size:12px; fill:var(--on-cc-container)}
.gn .gl.big{font-size:13px; letter-spacing:.04em}
.gn .gl.small{font-size:10.5px}
.gn .gl.mod{font-size:10.5px; letter-spacing:.02em}
.gn.module .lab{font-size:calc(11px * var(--labscale, 1)); font-weight:600; fill:var(--ink)}
.gn .lab{font-size:calc(10.5px * var(--labscale, 1)); fill:var(--muted); paint-order:stroke; stroke:var(--surface); stroke-width:3px; stroke-linejoin:round; pointer-events:none}
.gn.sel .lab,.gn.hover .lab{display:none}
.gn.item .lab,.gn.section .lab{display:none}
.gn.item.hl .lab,.gn.section.hl .lab{display:block}
.gn.done circle.body{fill:var(--line); stroke:none}
.gn.done .gl,.gn.done use{fill:var(--muted)}
.gn.done .lab{text-decoration:line-through}

@property --bw{syntax:'*'; inherits:false}
@property --bw-t{syntax:'*'; inherits:false}
@property --bw-l{syntax:'*'; inherits:false}
@property --frame{syntax:'*'; inherits:false}
@property --fill{syntax:'*'; inherits:false}
@property --frame-c{syntax:'*'; inherits:false}
*,::before,::after{--cut:polygon(0 0, calc(100% - var(--bev, 6px)) 0, 100% var(--bev, 6px), 100% 100%, 0 100%)}

.legend-g,.pp-card{--bev:10px}
.ann{--bev:8px}
.tag,.lvl,.chip,.flag,.links a{--bev:4px}
.chain,.cardsview textarea,.prog textarea{--bev:9px}
/* 2. Framed box, two layers like two nested boxes: ::before is the frame, the whole shape painted
   with --frame; ::after is the fill, painted with --fill, inset by the border widths and cut a
   little less (bev + bw x sqrt 2 - right - top), so the frame keeps its width along the diagonal.
   --frame and --fill may be gradients: a theme can give borders and backgrounds a gradient.
   --bw is the border width; --bw-t and --bw-l widen the top or the left side (an accent stripe).
   The element itself is not clipped, so content may overflow (the Today playhead) and a

function weekDates(mon){ var a = new Date(mon + "T00:00:00"), b = new Date(mon + "T00:00:00"); b.setDate(b.getDate() + 6);
  return a.getMonth() === b.getMonth() ? a.getDate() + " to " + b.getDate() + " " + MON[a.getMonth()] : a.getDate() + " " + MON[a.getMonth()] + " to " + b.getDate() + " " + MON[b.getMonth()]; }
function toMin(hhmm){ var p = String(hhmm || "").split(":"); return p.length === 2 ? Number(p[0]) * 60 + Number(p[1]) : null; }
function fmtT(m){ return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); }
function fmtH(m){ return m >= 60 ? (Math.round(m / 15) / 4).toString().replace(".5", "\u00BD").replace(".25", "\u00BC").replace(".75", "\u00BE") + " h" : m + " min"; }

// Canvas titles, shortened for the page: "Laboration 1 - Projektportfolio" -> "Lab 1, Projektportfolio".
function shortTitle(s){ return String(s).replace(/\bLaboration\b/g, "Lab").replace(/\s*\(submit your report\)/i, " report").replace(/\s+-\s+/g, ", "); }

  exercise: "barbell", solutions: "lightbulb", video: "play-circle", instructions: "clipboard-text", discussion: "chats", session: "play-circle", handin: "upload-simple", exam: "exam", link: "arrow-square-out" };

// Link chips are icons; the label shows on hover and to screen readers.
function linkIcon(label, url){

  if (/recording/i.test(l)) return "play-circle";
  if (/submit/i.test(l) || /\/assignments\/\d+$/.test(u)) return "upload-simple";
  if (/module/i.test(l)) return "tree-structure";

  if (/wireshark|packet tracer|download|install/i.test(l)) return "download-simple";

const REQ = { must_view: "view", must_mark_done: "mark done", must_contribute: "post", must_submit: "submit", min_score: "reach a score" };

/* ---------- Inventory access ---------- */
function items(code){ var c = INV.courses[code]; return c ? c.modules.reduce(function(a, m){ return a.concat(m.items); }, []) : []; }
// Expand a ref ("3.5", "3.4@Discussion", "#Required Software") to module items. Hand-ins and session pages only when named exactly.
function expand(code, ref){
  var all = items(code);
  if (ref.charAt(0) === "#") { var t = ref.slice(1).toLowerCase(); return all.filter(function(i){ return i.title.toLowerCase().indexOf(t) === 0; }); }
  var parts = ref.split("@"), num = parts[0], type = parts[1];
  return all.filter(function(i){
    if (!i.number || (type && i.type !== type)) return false;
    if (i.number === num) return true;
    return i.number.indexOf(num + ".") === 0 && i.kind !== "handin" && i.kind !== "session" && i.kind !== "link";
  });
}
function itemByNumber(code, num){ return items(code).find(function(i){ return i.number === num; }); }
function assignments(code){ var c = INV.courses[code]; return c ? c.assignments : []; }
function announcements(code){ var c = INV.courses[code]; return c ? c.announcements : []; }
function inList(code, listName, item){ var k = COURSES[code]; return (k && k[listName] || []).some(function(r){ return expand(code, r).some(function(x){ return x.id === item.id; }); }); }
function sessionLevel(s){
  var it = s.ref ? itemByNumber(s.course, s.ref) : null;
  if (it && inList(s.course, "must", it)) return "must";
  if (it && inList(s.course, "nice", it)) return "nice";
  return (s.kind === "lab" || s.kind === "seminar" || s.kind === "interview" || s.kind === "exam") ? "must" : "nice";
}
// MUST: graded work, required posts or submissions, the sessions you cannot miss, and whatever a MUST
// session or deadline depends on. NICE: the rest. Plan lists override.
var prepMust = {};
function computePrepMust(t){
  prepMust = {};
  t.sessions.forEach(function(s){ if (sessionLevel(s) !== "must") return; (s.prep || []).forEach(function(r){ expand(s.course, r).forEach(function(i){ prepMust[s.course + ":" + i.id] = true; }); }); });
}
function itemLevel(code, item){
  if (inList(code, "must", item)) return "must";
  if (inList(code, "nice", item)) return "nice";
  if (prepMust[code + ":" + item.id]) return "must";
  if (item.kind === "handin" || item.kind === "quiz" || item.kind === "exam") return "must";
  if (item.req === "must_submit" || item.req === "must_contribute") return "must";
  return "nice";
}
// The private build's own Canvas state, or on the hosted app the Student's Completion (release 2).
function canvasDone(code, item){ return !!(PROGRESS && PROGRESS.courses[code] && PROGRESS.courses[code][item.id]) || completionDone("m:" + code + ":" + item.id); }

/* ---------- What an assessment tests ---------- */
// The module item that stands for an assignment: a quiz, a lab hand-in, an exam.
function assessmentItem(code, aid){ return items(code).find(function(i){ return i.assignmentId === aid; }) || null; }
function isMaterial(i){ return i.kind !== "handin" && i.kind !== "exam" && i.kind !== "link"; }
// Rule: the other items in its own section; when it sits alone under its heading (every Z0025E
// quiz does), the items before it in the module, minus those under a heading that holds another
// assessment (Lab 3's subnet page is not Lab 4's). Then the plan's NEEDS refs. The rule is only for
// dated assessments: an ungraded practice quiz, or an item Canvas lists in no module (the home
// exam), gets only the refs. Hand-ins, exams and links are never material.
function needsOf(t, code, aid){
  var it = assessmentItem(code, aid); if (!it) return [];
  var mod = INV.courses[code].modules.find(function(m){ return m.items.indexOf(it) >= 0; }), at = mod.items.indexOf(it), seen = {}, out = [];
  var add = function(i){ if (i !== it && isMaterial(i) && !seen[i.id]) { seen[i.id] = 1; out.push(i); } };
  if (it.due && !it.unlisted) {
    var same = it.section ? mod.items.filter(function(i){ return i !== it && i.section === it.section; }) : [];
    if (same.length) same.forEach(add);
    else mod.items.forEach(function(i, k){ if (k < at && !(i.section && mod.items.some(function(x){ return x !== it && x.assignmentId && x.section === i.section; }))) add(i); });
  }
  ((t.needs || {})[code + ":" + aid] || []).forEach(function(r){ expand(code, r).forEach(add); });
  return out;
}
// The assessments an item is needed for.
function neededFor(t, code, item){ return assignments(code).filter(function(a){ return needsOf(t, code, a.id).indexOf(item) >= 0; }); }
// The Prepare line under an assessment in the week view: what it tests (needsOf), each a link to something to
// study: the Cards made from that item when there are any, else the item in Canvas. A Cards chip in front opens
// the assessment's Card Set. applyState refreshes it when a tick changes, loadCards when the Cards arrive.
function prepareLine(code, aid){
  if (!needsOf(term(), code, aid).length) return "";
  return '<span class="prepare" data-prepare="' + esc(code + ":" + aid) + '">' + prepareInner(code, aid) + '</span>';
}
// Drillable Cards with a source, or all of an assessment's Card Set; none on the claude.ai page or signed out.
function cardsWithSource(src){ var C = state.cards; return C && C.list ? drillable().filter(function(c){ return (c.sources || []).indexOf(src) >= 0; }) : []; }
function cardSetOf(code, aid){ var C = state.cards; return C && C.list ? drillable().filter(function(c){ return cardEvents(term(), c).some(function(e){ return e.code === code && String(e.a.id) === String(aid); }); }) : []; }
function prepareInner(code, aid){
  var need = needsOf(term(), code, aid), left = need.filter(function(x){ return !isDone("m:" + code + ":" + x.id); }), mins = matMinutes(left), set = cardSetOf(code, aid);
  return '<span class="nlab">Prepare</span>' +
    (set.length ? '<button type="button" class="nref cards" data-cardgo="' + esc(code + ":" + aid) + '" title="Drill the ' + set.length + (set.length === 1 ? ' card' : ' cards') + ' for this">' + ic("barbell", "sm") + set.length + '</button>' : '') +
    need.map(function(x){
      var src = "m:" + code + ":" + x.id, n = cardsWithSource(src).length, name = (x.number ? x.number + " " : "") + x.title, cls = "nref" + (isDone(src) ? " ok" : "");
      return n ? '<button type="button" class="' + cls + ' cards" data-cardgo="' + esc(src) + '" title="' + esc(n + (n === 1 ? " card" : " cards") + " on " + name) + '">' + ic("barbell", "sm") + esc(x.number || shortTitle(x.title)) + '<sup>' + n + '</sup></button>'
        : '<a class="' + cls + '" href="' + esc(x.url || "") + '" target="_blank" rel="noopener" title="' + esc("Open in Canvas: " + name) + '">' + esc(x.number || shortTitle(x.title)) + '</a>';
    }).join("") + '<span class="nsum">' + (need.length - left.length) + ' of ' + need.length + ' ticked' + (mins ? ', ' + fmtMin(mins) + ' left' : '') + '</span>';
}
function refreshPrepare(){
  document.querySelectorAll(".prepare[data-prepare]").forEach(function(el){
    var k = el.dataset.prepare.split(":"), code = k[0], aid = Number(k[1]);
    el.innerHTML = prepareInner(code, aid);
    el.classList.toggle("ready", needsOf(term(), code, aid).every(function(x){ return isDone("m:" + code + ":" + x.id); }));

/* ---------- Building the term's timeline ---------- */
function deadlineRows(t){
  var rows = [];
  t.courses.forEach(function(code){
    var groups = {};
    assignments(code).forEach(function(a){
      if (!a.due) return;
      if (a.kind === "quiz") { var g = code + ":quizzes:" + a.due; (groups[g] = groups[g] || { code: code, due: a.due, dueTime: a.dueTime, list: [] }).list.push(a); return; }
      var use = disagreedDeadline("d:" + code + ":" + a.id, a.due, a.dueTime);
      rows.push({ kind: "deadline", level: "must", id: "d:" + code + ":" + a.id, code: code, date: use.date, time: use.time, disagree: disagreementOf("d:" + code + ":" + a.id),
        title: shortTitle(a.title) + " due " + use.time, pts: a.points ? a.points + " p" : "", why: t.notes[code + ":" + a.id] || "", akind: a.kind,
        est: (itemByNumber(code, a.number) || {}).statedMinutes || null,
        links: [["Submit", a.url]].concat(a.moduleItemUrl ? [["In the module", a.moduleItemUrl]] : []) });
    });
    Object.keys(groups).forEach(function(g){
      var q = groups[g]; q.list.sort(function(x, y){ return (x.number || "").localeCompare(y.number || "", undefined, { numeric: true }); });
      var total = q.list.reduce(function(s, a){ return s + (a.points || 0); }, 0);
      rows.push({ kind: "deadline", level: "must", id: "d:" + g, code: q.code, date: q.due, time: q.dueTime, akind: "quiz", aids: q.list.map(function(a){ return a.id; }),
        title: "All " + q.list.length + " module quizzes close " + q.dueTime, pts: total ? total + " p" : "", why: t.notes[q.code + ":quizzes"] || "",
        links: q.list.map(function(a){ return [a.title.replace(/module (\d+) quiz/i, "Quiz $1"), a.url]; }) });
    });
  });
  return rows;
}
function sessionRows(t){
  return t.sessions.filter(function(s){ return t.courses.indexOf(s.course) >= 0; }).map(function(s){
    var links = [], k = COURSES[s.course];
    if (k && k.zoom && s.kind !== "exam") links.push(["Zoom", k.zoom]);
    var it = s.ref ? itemByNumber(s.course, s.ref) : null;
    if (it) links.push([it.kind === "session" ? "Recording and slides" : "Page", it.url]);
    (s.also || []).forEach(function(r){ var x = itemByNumber(s.course, r); if (x) links.push([x.number + " " + x.title.slice(0, 28), x.url]); });
    (s.links || []).forEach(function(l){ links.push(l); });
    var prep = (s.prep || []).reduce(function(a, r){ return a.concat(expand(s.course, r)); }, []);
    return { kind: "session", level: sessionLevel(s), code: s.course, date: s.date, time: s.start, end: s.end, title: s.title, disagree: disagreementOf("s:" + s.course + ":" + s.date + ":" + (s.start || "")), why: s.why || "", status: s.status || "", links: links, prep: prep, skind: s.kind, ref: s.ref || null, key: "s:" + s.course + ":" + s.date + ":" + (s.start || "") };
  });
}
function taskRows(t){
  return t.tasks.filter(function(x){ return t.courses.indexOf(x.course) >= 0; }).map(function(x){
    var target = null;
    if (x.for) { var parts = x.for.split(":"); target = assignments(parts[0]).find(function(a){ return String(a.id) === parts[1]; }); }
    // a task that feeds a deadline is as important as the deadline
    var level = x.level === "must" || target ? "must" : "nice";
    var feeds = target ? { title: shortTitle(target.title).split(",")[0], date: target.due, url: target.url } : null;
    return { kind: "task", level: level, id: "t:" + x.id, code: x.course, date: x.date, title: x.title, why: x.why || "", links: x.links || [], feeds: feeds };
  });
}
function studyBlocks(t){
  return t.study.filter(function(s){ return t.courses.indexOf(s.course) >= 0; }).map(function(s){
    var seen = {}, list = [];
    s.refs.forEach(function(r){ expand(s.course, r).forEach(function(i){ if (!seen[i.id]) { seen[i.id] = 1; list.push(i); } }); });
    return { week: s.week, code: s.course, why: s.why || "", items: list, key: "w:" + s.week + ":" + s.course };
  });
}
function weeksOf(t){ var out = [], m = monday(t.start); while (m <= t.end) { out.push(m); m = addDays(m, 7); } return out; }
function matMinutes(list){ return list.reduce(function(s, i){ return s + (i.minutes || 0); }, 0); }
// Calendar Events (release 2): the Student's own, from their Calendar Links, as rows marked as

function calRows(t){

    return { kind: "session", skind: "cal", cal: true, code: code || "", date: e.date, time: e.start, end: e.end, title: e.title, location: e.location, label: e.label, target: target, key: "c:" + e.uid + ":" + e.date };
  });
}
function withCalendar(t, rows){
  if (!state.cal) return rows;

}
function calRow(r){

  var tag = '<span class="tag yours" title="From your calendar' + (r.label ? ": " + esc(r.label) : "") + '">' + ic("calendar", "sm") + 'yours</span>';

/* ---------- Disagreements and Chains (release 5) ---------- */
// Disagreements: data/plan.mjs DISAGREEMENTS. For a deadline the earliest value not yet past is
// used until the Maintainer settles one (settled: the index of the source to trust).
function disagreementOf(id){ return (P.DISAGREEMENTS || []).find(function(d){ return d.about === id; }) || null; }
function disagreeText(d){ return "Sources disagree about the " + d.fact + ": " + d.values.map(function(v){ return v.source + ": " + (v.says || (v.date ? longDay(v.date) + (v.time ? " " + v.time : "") : "")); }).join("; ") + (d.settled != null ? ". Settled: " + d.values[d.settled].source : ". Until settled the page uses the earliest that has not passed."); }
function disagreedDeadline(id, date, time){
  var d = disagreementOf(id); if (!d || d.fact !== "deadline") return { date: date, time: time };
  if (d.settled != null && d.values[d.settled].date) return { date: d.values[d.settled].date, time: d.values[d.settled].time || time };
  var now = todayIso(), best = { date: date, time: time };
  d.values.forEach(function(v){ if (v.date && v.date >= now && (v.date + " " + (v.time || "23:59")) < (best.date + " " + (best.time || "23:59"))) best = { date: v.date, time: v.time || best.time }; });
  return best;
}
function disagreementReport(code){
  var list = (P.DISAGREEMENTS || []).filter(function(d){ return d.about.split(":")[1] === code; });
  return COURSES[code].name + " (" + code + "): places where the course material disagrees\n\n" + list.map(function(d, n){
    return (n + 1) + ". " + d.fact.charAt(0).toUpperCase() + d.fact.slice(1) + " of " + aboutTitle(d.about) + ":\n" + d.values.map(function(v){ return "   - " + v.source + ": " + (v.says || (v.date ? v.date + (v.time ? " " + v.time : "") : "")) + (v.url ? " (" + v.url + ")" : ""); }).join("\n");
  }).join("\n\n") + "\n";
}
function aboutTitle(id){
  var p = id.split(":");
  if (p[0] === "d") { var a = assignments(p[1]).find(function(x){ return String(x.id) === p[2]; }); return a ? a.title : id; }
  var s = term().sessions.find(function(x){ return "s:" + x.course + ":" + x.date + ":" + (x.start || "") === id; }); return s ? s.title + " (" + longDay(s.date) + ")" : id;
}
// Key Events (CONTEXT.md): sessions where something is decided (lab sessions with the teacher,
// workshops, the interview, the final seminar, the oral exam) and the exams with a deadline.
var KEY_SESSION = { lab: 1, workshop: 1, interview: 1, seminar: 1, exam: 1 };
function keyEvents(t){
  var out = [];
  sessionRows(t).forEach(function(r){ if (KEY_SESSION[r.skind]) out.push({ key: r.key, code: r.code, date: r.date, time: r.time, title: r.title, row: r, kind: "session" }); });
  deadlineRows(t).forEach(function(r){ if (r.akind === "exam") out.push({ key: r.id, code: r.code, date: r.date, time: r.time, title: r.title.replace(/ due \d\d:\d\d$/, ""), row: r, kind: "deadline", aid: r.id.split(":")[2] }); });
  return out.sort(function(a, b){ return (a.date + (a.time || "")).localeCompare(b.date + (b.time || "")); });
}
// When the Course teaches an item (its Taught Date): a session on its page, or its study week.
function taughtDate(t, code, item){
  var s = t.sessions.find(function(x){ return x.course === code && x.ref && item.number && x.ref === item.number; });
  if (s) return s.date;
  var w = t.study.find(function(x){ return x.course === code && x.refs.some(function(r){ return item.number && (item.number === r || item.number.indexOf(r + ".") === 0); }); });
  return w ? w.week : null;
}
function prepOf(t, ke){
  var out = [], seen = {}, add = function(p){ if (!seen[p.id]) { seen[p.id] = 1; out.push(p); } };
  var material = function(code, list){ list.forEach(function(i){ var td = taughtDate(t, code, i); add({ id: "m:" + code + ":" + i.id, code: code, title: (i.number ? i.number + " " : "") + i.title, url: i.url, taught: td, late: !!td && td > ke.date, minutes: i.minutes || null }); }); };
  // Assignment ids are numbers in the inventory; ids taken from a row id are text.
  if (ke.kind === "deadline") material(ke.code, needsOf(t, ke.code, Number(ke.aid)));
  else {
    var n = /\bLab (\d+)\b/.exec(ke.title), b = ke.row.skind === "lab" && n ? (P.BOOKINGS || []).find(function(x){ return x.course === ke.code && x.section === "Lab" + n[1]; }) : null;
    if (b) {
      var task = t.tasks.find(function(x){ return x.id === b.task; });
      if (task) add({ id: "t:" + task.id, code: ke.code, title: task.title, date: task.date });
      var aid = b.for.split(":")[1], rep = deadlineRows(t).find(function(r){ return r.id === "d:" + b.for; });
      if (rep) add({ id: rep.id, code: ke.code, title: rep.title, date: rep.date, url: rep.links && rep.links[0] && rep.links[0][1] });
      material(ke.code, needsOf(t, ke.code, Number(aid)));

function prepReady(p){ return isDone(p.id); }

function timeline(t){
  var rows = deadlineRows(t).concat(sessionRows(t)).concat(taskRows(t));
  rows.sort(function(a, b){ return a.date.localeCompare(b.date) || String(a.time || "").localeCompare(String(b.time || "")) || (a.kind === "session" ? -1 : 1); });
  return rows;
}
// Endangered: unfinished, not muted, and due today or in the next six days (overdue counts too),
// or MUST material of the current week or an earlier one. Nothing further ahead pulses.
function endangeredRow(r){ return !!r.id && r.date < addDays(todayIso(), SOON_DAYS); }
function endangeredItem(week){ return week <= monday(todayIso()); }

/* ---------- Rendering pieces ---------- */
function chip(code){ var k = COURSES[code] || {}; return faces(code) + '<span class="chip" style="' + colorVars(code) + '"' + (k.name ? ' title="' + esc(k.name + " " + code) + '"' : '') + '>' + esc(label(code)) + '</span>'; }
function faces(code){

      } else if (cvb.dataset.cv === "forget") { cv.forget(); state.canvasHint = ""; state.canvas = null; state.canvasErr = null; lsSet(LS.canvasCache, ""); applyState(); renderTerm(); return; }

// Old tick ids from earlier page versions map onto the new ones.
function migrate(checked){
  var out = {};
  Object.keys(checked || {}).forEach(function(k){ out[P.LEGACY_IDS[k] || (/^(d|t|m):/.test(k) ? k : "t:" + k)] = true; });
  return out;
}
function migrateAt(tickAt){
  var out = {};
  Object.keys(tickAt || {}).forEach(function(k){ var to = P.LEGACY_IDS[k] || (/^(d|t|m):/.test(k) ? k : "t:" + k); if (!out[to] || tickAt[k] > out[to]) out[to] = tickAt[k]; });
  return out;
}

function defaultTerm(){
  var now = todayIso();
  var cur = TERMS.find(function(t){ return t.courses.length && now >= t.start && now <= t.end; });
  if (cur) return cur.id;
  var next = TERMS.find(function(t){ return t.courses.length && t.start > now; });
  return (next || TERMS.filter(function(t){ return t.courses.length; }).pop() || TERMS[0]).id;
}

// Each viewer's ticks live in their own private subtree, data/users/<id>/, which nobody else can read.
// Viewers without an id (outside the author's organisation, or signed out) keep ticks in this browser only.
(async function(){
  try {
    if (!window.claude || !window.claude.use) return;
    var db = await window.claude.use("db");
    var user = await window.claude.use("user");
    if (!db || !user) return;
    var uid = await user.id();
    if (!uid) return;
    var ref = db.doc("data/users/" + uid + "/progress");
    var snap = await ref.get();
    if (snap && snap.data) {
      mergeTicks(snap.data.checked, snap.data.tickAt);
      mergePlanned(snap.data.planned);
      if (snap.data.exportedAt && (!state.exportedAt || snap.data.exportedAt > state.exportedAt)) state.exportedAt = snap.data.exportedAt;
      Object.keys(snap.data.muted || {}).forEach(function(k){ state.muted[k] = true; });
      mergeSnaps(snap.data.snaps);
      lsSet(LS.ticks, JSON.stringify(state.checked)); lsSet(LS.tickAt, JSON.stringify(state.tickAt)); lsSet(LS.muted, JSON.stringify(state.muted));
      applyState();
    }
    store = ref;
    save();   // ticks made here before signing in reach the account now, merged by the rule above
  } catch (e) {}
})();
